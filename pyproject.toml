[project]
name = "boundary"
version = "0.1.0"
description = "One library every model call in the portfolio goes through: raw-HTTP adapters, routing by configuration, a cost ledger row and a telemetry span per call, spend caps, and an inviolable pass-through mode."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Peter Parker" }]
dependencies = [
  # Transport. Pinned below 1.0 because httpx is the one client the drift record depends on;
  # a major bump changes defaults (timeouts, HTTP/2, redirects) and needs a deliberate review.
  "httpx>=0.28,<1",
  # Configuration validation for boundary.yaml, caps.yaml and the price files.
  "pydantic>=2,<3",
  # YAML loader for the configuration files. 6.x is the only maintained line.
  "pyyaml>=6,<7",
  # One span per call. The API and SDK move together; 1.x is the stable line.
  "opentelemetry-api>=1,<2",
  "opentelemetry-sdk>=1,<2",
  # TLS verification against the operating system's trust store rather than a bundled list,
  # so a machine behind a TLS-inspecting proxy (a workplace laptop) verifies the same chain
  # the browser does. Below 1.0 because the API is still settling.
  "truststore>=0.10,<1",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  # Mocks the httpx transport so every adapter has golden requests and responses.
  "respx>=0.22,<1",
  "mypy>=1,<2",
  "ruff>=0.13,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
boundary = "boundary.cli:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boundary"]

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff formats Python code blocks inside Markdown by default; the plan and the docs keep
# their own layout.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
  # Trailing commas and line length are handled by the formatter.
  "E501",
  # The error names (SpendCapExceeded, PassthroughViolation, UnknownAlias, UnknownPrice) are
  # part of the frozen interface in PLAN.md section 3; they do not take an Error suffix.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["boundary", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["respx", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[project]
name = "boundary"
version = "0.19.0"
description = "One library every model call in the portfolio goes through: raw-HTTP adapters, routing by configuration, a cost ledger row and a telemetry span per call, spend caps, and an inviolable pass-through mode."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Peter Parker" }]
dependencies = [
  # Transport. Pinned below 1.0 because httpx is the one client the drift record depends on;
  # a major bump changes defaults (timeouts, HTTP/2, redirects) and needs a deliberate review.
  "httpx>=0.28,<1",
  # Configuration validation for boundary.yaml, caps.yaml and the price files.
  "pydantic>=2,<3",
  # YAML loader for the configuration files. 6.x is the only maintained line.
  "pyyaml>=6,<7",
  # One span per call. The API and SDK move together; 1.x is the stable line.
  "opentelemetry-api>=1,<2",
  "opentelemetry-sdk>=1,<2",
  # TLS verification against the operating system's trust store rather than a bundled list,
  # so a machine behind a TLS-inspecting proxy (a workplace laptop) verifies the same chain
  # the browser does. Below 1.0 because the API is still settling.
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
# Vertex, and only Vertex. A Google OAuth access token lasts about an hour, so a run longer
# than that has to mint tokens rather than be handed one; PLAN.md section 2.2 allows this
# single dependency, "used for the token only". Optional so that 02 and 03, which call
# Anthropic, OpenAI, Google and an open-weights host, install none of it.
#
# google-auth alone, without its `requests` or `urllib3` transport extras: the token is
# fetched through this library's own pinned httpx client so that it verifies TLS against the
# same store every vendor call does. See boundary/credentials.py.
vertex = ["google-auth>=2,<3"]
# Presidio, for the entity types a regular expression cannot find: people, places,
# organisations. Optional because it pulls in spaCy and needs a model downloaded separately
# (docs/redact.md), and because everything else in boundary.redact, the built-in
# recognisers, the analyzer's guarantees and the whole policy, works without it. Below 3
# because 2.x is the line whose analyzer result shape the adapter reads.
redact = ["presidio-analyzer>=2,<3"]
# The OpenAI-compatible proxy (0.13, PLAN.md B2.1): `boundary serve`. Optional because a
# library caller never runs a server, and 02, 03 and 07 install none of it. FastAPI because
# PLAN.md B4 names it and its request models are the pydantic the library already uses;
# below 1.0 because FastAPI is still pre-1.0 and has changed defaults between minors, so a
# bump is reviewed rather than taken. Uvicorn is the ASGI server `boundary serve` starts;
# below 1.0 for the same reason.
server = [
  "fastapi>=0.141,<1",
  "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  # Mocks the httpx transport so every adapter has golden requests and responses.
  "respx>=0.22,<1",
  "mypy>=1,<2",
  "ruff>=0.13,<1",
  "types-PyYAML>=6,<7",
  # OpenAI's real BPE vocabulary, used only by `boundary experiment token-estimates` to give
  # the estimating design its strongest case (Rule C candidate 2). Development only and
  # deliberately not a runtime dependency: needing a tokenizer to state a cost is the design
  # that experiment rejects. Below 1.0 because the encoding registry is still settling.
  "tiktoken>=0.8,<1",
  # OpenAI's own client, in tests only, as the conformance check for the proxy: B10 asks that
  # a real client library works by changing only the base URL and key, and the only honest
  # test of that is the real client. Never imported by the library, which builds every
  # request body itself (CLAUDE.md, no vendor SDKs). Below 4 because 3.x is the line tested.
  "openai>=3,<4",
]

[project.scripts]
boundary = "boundary.cli:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boundary"]
# The dated price files ship with the library, so a project that pins a version gets the rates
# that version was released with. Costing is then reproducible from the pin alone, instead of
# depending on a price directory each project copies and lets drift.
artifacts = ["boundary/prices/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff formats Python code blocks inside Markdown by default; the plan and the docs keep
# their own layout.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
  # Trailing commas and line length are handled by the formatter.
  "E501",
  # The error names (SpendCapExceeded, PassthroughViolation, UnknownAlias, UnknownPrice) are
  # part of the frozen interface in PLAN.md section 3; they do not take an Error suffix.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["boundary", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["respx", "respx.*"]
ignore_missing_imports = true

# google-auth is an optional dependency and is deliberately not installed in the default
# development environment, so that the import guard in boundary/credentials.py is exercised
# rather than assumed. Its absence must not fail the type check.
[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

# Same reason: the `redact` extra is optional, and the adapter in boundary/redact/presidio.py
# is typed against its own protocol rather than against Presidio's classes.
[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="668" viewBox="0 0 1090 668" role="img" aria-label="Portfolio projects call the library directly and OpenAI-compatible clients call the proxy; both reach the same Gateway, which routes by configuration, checks the data policy and the caps, calls the vendor over raw HTTP, costs the call from a dated price file and writes one ledger row that the sealer chains and GitHub anchors daily." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">

# Pages for the allow list of PLAN.md B2.8 part 1, in project 03's source-spec format so that
# 03's own fetcher (`gate.sources.fetch_all`) reads them, through bench/quality/gate_bridge.py.
#
# None of these is one of the 40 pages 03's gold set is answered from; a test holds that. The
# allow list is derived from these mechanically (boundary.redact.quality.derive_allow) and
# never from the gold pages, because a list tuned on the test pages would measure the tuning.
# Chosen from the leaf links of each publisher's section indexes, read 2026-09-27, before any
# answer was generated. Open Government Licence - Canada (FCAC) and US public domain
# (investor.gov), which is why the extracted text is committed beside this file.
#
# The User-Agent is per host for the reason 03's gold-sources files give: canada.ca serves the
# crawler form with a URL and tarpits anything else, investor.gov refuses any string with one.

default_user_agent: "boundary/0.20 (+https://github.com/Peter-A-P/compliant-ai-gateway)"


name: smoke

# Live calls through this library, on GitHub's runners.
#
# It exists because the laptop's usual network inspects TLS, so a vendor call from there
# would pass a personal API key and a prompt through an intermediary that should see
# neither. The v0.1.0 smoke calls
# ran from the release-gate repository, where the keys already lived as secrets; this
# workflow brings them here, where the library is, and adds the batch path that v0.2.0 needs
# exercised before it can be tagged.
#
# Manual only, and it costs a few cents. Every call writes a ledger row like any other, and
# the report at the end is what the run is for: the numbers, not the exit code.
#
# Two modes:
#
#   submit   (default) one short call per vendor, then a two-request Anthropic batch
#            submitted and collected. If the vendor has not finished the batch inside
#            `batch_wait` the step fails on purpose, naming the batch id, because a green
#            tick must not mean "the batch was collected" when it was not. The rows stay in
#            flight at their estimate and the ledger artefact holds them.
#
#   collect  finish a batch submitted by an earlier run: set `collect_batch_id` and
#            `ledger_run_id`, and this restores that run's ledger artefact and completes the
#            rows from it. This is the library's cross-process path, used for real rather
#            than described, and it is how a batch is recovered when the vendor was slow.
#
# It needs four repository secrets: ANTHROPIC_API_KEY, OPENAI_API_KEY, GOOGLE_API_KEY and
# OPENWEIGHTS_API_KEY. The local provider is not smoked here; a local server is a laptop
# thing and its call cannot leave the machine anyway.
#
# AWS_BEARER_TOKEN_BEDROCK is a fifth, and optional. Its step is skipped when the secret is
# absent rather than failing, because the adapter shipped before the key did and a run that
# went red for a missing optional credential would train people to ignore a red run. Set it
# to a Bedrock API key and the step starts running; nothing else changes. Foundry and Vertex
# have no step yet for a simpler reason: their provider entries still say REPLACE-ME, so
# there is nothing for a secret to authenticate against.

on:
  workflow_dispatch:
    inputs:
      single:
        description: "one short call per vendor"
        required: false
        default: "true"
      batch:
        description: "submit a two-request Anthropic batch and collect it"
        required: false
        default: "true"
      batch_wait:
        description: "seconds to wait for the batch to end before failing"
        required: false
        default: "1200"
      extra_models:
        description: "space-separated provider/model-id list to smoke as well"
        required: false
        default: ""
      collect_batch_id:
        description: "collect this already-submitted batch instead of sending anything new"
        required: false
        default: ""
      ledger_run_id:
        description: "the run whose smoke-ledger artefact holds that batch's rows"
        required: false
        default: ""

permissions:
  contents: read
  # Reading another run's artefact, which is how a batch submitted by an earlier run is
  # collected by a later one.
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENWEIGHTS_API_KEY: ${{ secrets.OPENWEIGHTS_API_KEY }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      # Labels every row this run writes, so a merged ledger says where the call was made.
      BOUNDARY_ENV: actions
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run python -c "import boundary; print('boundary', boundary.__version__)"

      # -- collect mode ----------------------------------------------------------------
      - name: Restore the ledger that submitted the batch
        if: inputs.collect_batch_id != ''
        uses: actions/download-artifact@v4
        with:
          name: smoke-ledger
          run-id: ${{ inputs.ledger_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Where the batch had got to
        if: inputs.collect_batch_id != ''
        continue-on-error: true
        run: uv run boundary batch status ${{ inputs.collect_batch_id }} --ledger boundary.sqlite
      - name: Collect the batch
        if: inputs.collect_batch_id != ''
        run: >
          uv run boundary batch collect ${{ inputs.collect_batch_id }}
          --ledger boundary.sqlite
          --wait ${{ inputs.batch_wait }}

      # -- submit mode -----------------------------------------------------------------
      # One step per vendor, and none stops the others, so one bad key does not hide the rest.
      - name: Smoke anthropic
        if: inputs.collect_batch_id == '' && inputs.single == 'true'
        continue-on-error: true
        run: uv run boundary smoke anthropic --run-id smoke-actions
      - name: Smoke openai
        if: inputs.collect_batch_id == '' && inputs.single == 'true'
        continue-on-error: true
        run: uv run boundary smoke openai --run-id smoke-actions
      - name: Smoke google
        if: inputs.collect_batch_id == '' && inputs.single == 'true'
        continue-on-error: true
        run: uv run boundary smoke google --run-id smoke-actions
      - name: Smoke openweights
        if: inputs.collect_batch_id == '' && inputs.single == 'true'
        continue-on-error: true
        run: uv run boundary smoke openweights --run-id smoke-actions
      # Claude on Amazon Bedrock, ca-central-1, through the Anthropic Messages route. The
      # model id carries the `us.` geographic inference profile, which is a residency
      # decision and not decoration: the provider entry declares `residency: geo` and the
      # adapter refuses the pair if they ever stop agreeing.
      #
      # This row will be UNCOSTED. AWS publishes its own Claude rates, they were not readable
      # from the published page on 2026-09-15, and an unknown price writes an uncosted row
      # rather than an estimate. The row is still worth having: it is the live evidence
      # PLAN.md section 5.1 item 9 asks for, and the cost follows when the rates do.
      - name: Smoke bedrock
        if: >
          inputs.collect_batch_id == '' && inputs.single == 'true'
          && env.AWS_BEARER_TOKEN_BEDROCK != ''
        continue-on-error: true
        run: uv run boundary smoke bedrock --run-id smoke-actions
      - name: Say why bedrock was skipped
        if: >
          inputs.collect_batch_id == '' && inputs.single == 'true'
          && env.AWS_BEARER_TOKEN_BEDROCK == ''
        run: >
          echo "bedrock skipped: no AWS_BEARER_TOKEN_BEDROCK secret.
          Add one to run it; see docs/hyperscaler-setup.md step 6."

      - name: Smoke the extra models
        if: inputs.collect_batch_id == '' && inputs.extra_models != ''
        continue-on-error: true
        run: |
          for m in ${{ inputs.extra_models }}; do
            p="${m%%/*}"
            uv run boundary smoke "$p" --model "$m" --run-id smoke-actions || echo "FAILED $m"
          done

      # The v0.2.0 gate. No continue-on-error: if the vendor has not finished the batch in
      # time this step fails and names the id, so the run says what actually happened and
      # the batch can be collected by a later run in collect mode.
      - name: Smoke the Anthropic batch path
        if: inputs.collect_batch_id == '' && inputs.batch == 'true'
        run: >
          uv run boundary smoke anthropic --batch
          --run-id smoke-actions-batch
          --wait ${{ inputs.batch_wait }}

      # -- always ----------------------------------------------------------------------
      # What the run is actually for. Rows still in flight are reported as a warning, which
      # is what an unfinished batch looks like.
      - name: Ledger rows for every call this run made
        if: always()
        run: uv run boundary ledger report --ledger boundary.sqlite

      - name: Keep the ledger as an artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ledger
          path: boundary.sqlite
          if-no-files-found: warn

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # The `server` extra is installed here, unlike `vertex` and `redact` below, because
      # the proxy is typed against FastAPI's own classes rather than a protocol of its own,
      # so mypy has to see the real ones. 02 and 03 install `boundary` without extras and
      # are unaffected.
      - run: uv sync --frozen --extra server
      # Fail here rather than in the tests: tests/conftest.py leaves test_server.py
      # uncollected when FastAPI is missing, so a quietly failed install would leave this
      # job green while checking none of the proxy.
      - run: uv run python -c "import fastapi, uvicorn, openai"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      # The data policy's adversarial suite, through the library and through the proxy.
      # Both exit 1 on any forbidden case sent or any allowed case refused, and neither
      # needs a key or the network. Run here, before the vertex sync below would remove the
      # server extra the proxy suite needs.
      - run: uv run boundary policy eval
      - run: uv run boundary policy eval --proxy
      # The `vertex` extra is deliberately absent above, so the suite runs with google-auth
      # missing and exercises the import guard that tells a user which extra to install.
      # This step installs it and re-runs the credential tests, which is the only place the
      # two assumptions about the real library get checked: that it accepts a duck-typed
      # transport, and that the expiry it sets is naive.
      - run: uv sync --frozen --extra vertex
      - run: uv run pytest tests/test_credentials.py
      # The redaction table in the README, run for real on every push. It needs no key, no
      # account, no network and no model, which is the property that makes it the one
      # measurement here a stranger can reproduce, and a published number that nothing runs
      # is a number nobody is checking. Fewer pages than the published run: this is a
      # smoke test of the harness, and the README row is written from the 200-page run.
      - run: uv run boundary redact eval --pages 40 --out /tmp/redact.json
      # The Canadian identifier set. Its assertions live in tests/test_redact_eval.py;
      # this step is here so the table a reader sees is printed by a run rather than
      # copied from one.
      - run: uv run boundary redact eval --identifiers --per-family 20
      - run: uv run boundary redact eval --rehydration --pages 40

  # The `redact` extra and its spaCy model are deliberately absent from the job above, so
  # the suite there runs with Presidio missing and exercises the import guard. They are
  # heavy (spaCy plus a 400 MB model), so they get a job of their own rather than slowing
  # every run, and that job is the only place the two live assertions are checked: that
  # Presidio still returns the defects the adapter works around, and that the engine this
  # library builds actually declares ORGANIZATION. Both are assertions about somebody
  # else's library, so they have to run against it rather than against a fake.
  redact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra redact
      # The model wheel by URL and by exact version, rather than `spacy download`, so the
      # job installs the same weights every run: a model that changed under us would change
      # what the live tests assert without anything in this repository moving.
      - run: >
          uv pip install
          https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
      # Fail here rather than in the tests. `test_redact.py` skips its live cases when
      # Presidio or the model is missing, so an install that quietly failed would leave this
      # job green while checking nothing, which is worse than a red one.
      - run: uv run python -c "import presidio_analyzer, en_core_web_lg"
      - run: uv run pytest tests/test_redact.py -v
      # And the measurement with the model, which is the column the README quotes for
      # person recall. Presidio is the only reason that column exists, so it is checked
      # where Presidio is installed.
      - run: uv run boundary redact eval --pages 40 --presidio --out /tmp/redact-presidio.json

# Price list, USD per million tokens. Supersedes 2026-09-10.yaml, which it copies.
# Repricing is a new dated file, never an edit to an older one.
#
# Added 2026-09-12: the three GPT-5.6 models, because the panel's OpenAI frontier route moved
# to one of them and a route with no rate writes uncosted rows. Read from
# https://developers.openai.com/api/docs/pricing on 2026-09-12.
#
# Amended the same day with `cache_read` for both Together models. Not a repricing and so not
# a new file: no rate here changed, a missing rate was added, and no row already costed against
# this file would compute differently. The three rows it affects were uncosted, which is what
# drew attention to it.
#
# Every rate the previous file carried was re-read the same day and none of them moved:
# gpt-5.4 2.50/15.00, gpt-5.4-mini 0.75/4.50, gpt-5.5 5.00/30.00. A repricing that changes
# nothing is still worth writing down, because "nothing changed" is only a fact once somebody
# has looked.
#
# Rules: a model missing here is written to the ledger as uncosted; a call that used a cache
# or batch feature with no rate here is uncosted. The library never fills a rate in.
#
# Model keys are identifiers. The ledger prices by the identifier the vendor RETURNS and, when
# that one is not listed, by the identifier that was REQUESTED (OpenAI returns dated ids such
# as gpt-5-nano-2025-08-07 for a request of gpt-5-nano; the price is the same). Both ids are
# in the ledger row, so which one priced the call is auditable.
#
# Sources:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing (cache read 0.1x input,
#              5-minute cache write 1.25x input, batch 50%). The models endpoint on 2026-09-10
#              lists claude-haiku-4-5-20251001 as the only dated id with a documented alias.
#   OpenAI:    https://developers.openai.com/api/docs/pricing (cached input shown per model,
#              batch 50%).
#   Google:    https://ai.google.dev/gemini-api/docs/pricing (paid tier; context-cache read shown
#              per model; cache storage is billed per hour, not per token, so no cache_write rate;
#              batch 50%). gemini-2.5-flash-lite returned 404 "no longer available to new
#              users" on 2026-09-10; kept here for any ledger row that still names it.
#   Together:  https://www.together.ai/pricing (serverless; one price for input and output on
#              Llama 3.3 70B).

version: 1
date: 2026-09-12
currency: USD
source: "Vendor price pages fetched 2026-09-09, 2026-09-10 and 2026-09-12; see comments for URLs and rules"

per_million_tokens:
  anthropic:
    claude-haiku-4-5-20251001:
      input: 1.00
      output: 5.00
      cache_read: 0.10
      cache_write: 1.25
      batch_multiplier: 0.5
    claude-haiku-4-5:
      input: 1.00
      output: 5.00
      cache_read: 0.10
      cache_write: 1.25
      batch_multiplier: 0.5
    claude-sonnet-5:
      input: 2.00
      output: 10.00
      cache_read: 0.20
      cache_write: 2.50
      batch_multiplier: 0.5
    claude-opus-5:
      input: 5.00
      output: 25.00
      cache_read: 0.50
      cache_write: 6.25
      batch_multiplier: 0.5
    claude-sonnet-4-6:
      input: 3.00
      output: 15.00
      cache_read: 0.30
      cache_write: 3.75
      batch_multiplier: 0.5

  openai:
    gpt-5-mini:
      input: 0.25
      output: 2.00
      cache_read: 0.025
      batch_multiplier: 0.5
    gpt-5-nano:
      input: 0.05
      output: 0.40
      cache_read: 0.005
      batch_multiplier: 0.5
    gpt-5:
      input: 1.25
      output: 10.00
      cache_read: 0.125
      batch_multiplier: 0.5
    gpt-5.4-nano:
      input: 0.20
      output: 1.25
      cache_read: 0.02
      batch_multiplier: 0.5
    gpt-5.4-mini:
      input: 0.75
      output: 4.50
      cache_read: 0.075
      batch_multiplier: 0.5
    gpt-5.4:
      input: 2.50
      output: 15.00
      cache_read: 0.25
      batch_multiplier: 0.5
    gpt-5.5:
      input: 5.00
      output: 30.00
      cache_read: 0.50
      batch_multiplier: 0.5
    # The GPT-5.6 line, 2026-09-12. Three models rather than a size ladder, and the prices are
    # what separate them: luna is the small one, terra the middle, sol the top. sol at 4.00/20.00
    # is the closest thing OpenAI sells to Claude Opus 5 at 5.00/25.00, and terra at 2.00/12.00
    # sits beside Claude Sonnet 5 at 2.00/10.00.
    gpt-5.6-luna:
      input: 0.20
      output: 1.20
      cache_read: 0.02
      batch_multiplier: 0.5
    gpt-5.6-terra:
      input: 2.00
      output: 12.00
      cache_read: 0.20
      batch_multiplier: 0.5
    gpt-5.6-sol:
      input: 4.00
      output: 20.00
      cache_read: 0.40
      batch_multiplier: 0.5
    gpt-4o-mini:
      input: 0.15
      output: 0.60
      cache_read: 0.075
      batch_multiplier: 0.5

  google:
    gemini-2.5-flash:
      input: 0.30
      output: 2.50
      cache_read: 0.03
      batch_multiplier: 0.5
    gemini-2.5-flash-lite:
      input: 0.10
      output: 0.40
      cache_read: 0.01
      batch_multiplier: 0.5
    gemini-3.5-flash:
      input: 1.50
      output: 9.00
      cache_read: 0.15
      batch_multiplier: 0.5
    gemini-3.5-flash-lite:
      input: 0.30
      output: 2.50
      cache_read: 0.03
      batch_multiplier: 0.5
    gemini-3.6-flash:
      input: 0.75
      output: 3.75
      cache_read: 0.075
      batch_multiplier: 0.5
    gemini-3.7-flash:
      input: 0.75
      output: 3.75
      cache_read: 0.075
      batch_multiplier: 0.5
    gemini-3.8-flash:
      input: 0.75
      output: 3.75
      cache_read: 0.075
      batch_multiplier: 0.5

  openweights:
    # `cache_read` added 2026-09-12 after the first live call, and it is the reason
    # together-open-b wrote three uncosted rows. Together serves prompt caching and reports
    # `cached_tokens` in its usage: gpt-oss-120b returned 66 to 68 of them per call. The
    # gateway refuses to price a call that used a feature it has no rate for, which is the
    # right refusal and is how this was found at all rather than at the invoice.
    #
    # Read from https://www.together.ai/pricing on 2026-09-12: neither of these two models
    # shows a discounted cached rate, where others in the catalogue do, so cache reads are
    # charged as ordinary input. Checked rather than assumed, because a wrong rate here is a
    # wrong number in a cost table that this project publishes.
    meta-llama/Llama-3.3-70B-Instruct-Turbo:
      input: 1.04
      output: 1.04
      cache_read: 1.04
    openai/gpt-oss-120b:
      input: 0.15
      output: 0.60
      cache_read: 0.15

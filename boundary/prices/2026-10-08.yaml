# Price list, USD per million tokens. Supersedes 2026-10-01.yaml, which it copies verbatim
# except for one added Anthropic entry. Repricing is a new dated file, never an edit to an
# older one.
#
# Added 2026-10-08: anthropic `claude-haiku-5-5`, released 2026-10-07, from
# https://platform.claude.com/docs/en/about-claude/pricing and
# https://platform.claude.com/docs/en/models/haiku-5-5/overview, both read 2026-10-08. No
# other rate on the page changed; Claude Haiku 4.5 is still US$1 in and US$5 out.
#
# Haiku 5.5 is the first model here priced by the length of the prompt: US$0.10 in, US$0.50
# out, US$0.125 a 5-minute cache write and US$0.01 a cache read "for prompts up to 100,000
# tokens", and US$0.50, US$2.50, US$0.625 and US$0.05 "for prompts over 100,000 tokens". The
# `long_prompt` block (1.2.0) carries the second set. The page does not say which usage fields
# make up the prompt; the library counts input plus cache reads plus cache writes, every token
# the model read, so a call is never costed at the lower rate when it was billed the higher.
# Batch is 50% at both lengths, as the page lists it.
#
# The 1-hour cache write (US$0.20, and US$1 over 100,000) is not expressible here, as for every
# Anthropic model: the adapter reads one cache-write count and the file holds one rate, the
# 5-minute one. Nothing that calls this model through the library asks for the 1-hour cache.
#
# Haiku 5.5 uses the tokenizer of Claude 4.7 and later, which counts about 30% more tokens for
# the same text than Haiku 4.5 does, so the same prompt is about 7 to 8 times cheaper, not 10.
# What 2026-10-01.yaml says about its own entries still applies; read it there.

version: 1
date: 2026-10-08
currency: USD
source: "2026-10-01.yaml carried over unchanged, plus Claude Haiku 5.5 from Anthropic's pricing page read 2026-10-08; see comments"

per_million_tokens:
  anthropic:
    claude-haiku-4-5-20251001:
      input: 1.00
      output: 5.00
      cache_read: 0.10
      cache_write: 1.25
      batch_multiplier: 0.5
    claude-haiku-4-5:
      input: 1.00
      output: 5.00
      cache_read: 0.10
      cache_write: 1.25
      batch_multiplier: 0.5
    claude-sonnet-5:
      input: 2.00
      output: 10.00
      cache_read: 0.20
      cache_write: 2.50
      batch_multiplier: 0.5
    claude-opus-5:
      input: 5.00
      output: 25.00
      cache_read: 0.50
      cache_write: 6.25
      batch_multiplier: 0.5
    claude-sonnet-4-6:
      input: 3.00
      output: 15.00
      cache_read: 0.30
      cache_write: 3.75
      batch_multiplier: 0.5
    claude-opus-5-5:
      input: 4.00
      output: 20.00
      cache_read: 0.20
      cache_write: 5.00
      batch_multiplier: 0.5
    claude-sonnet-5-5:
      input: 2.00
      output: 10.00
      cache_read: 0.20
      cache_write: 2.50
      batch_multiplier: 0.5
    claude-fable-5-1:
      input: 10.00
      output: 50.00
      cache_read: 0.25
      cache_write: 12.50
      batch_multiplier: 0.5
    claude-haiku-5-5:
      input: 0.10
      output: 0.50
      cache_read: 0.01
      cache_write: 0.125
      batch_multiplier: 0.5
      long_prompt:
        above_tokens: 100000
        input: 0.50
        output: 2.50
        cache_read: 0.05
        cache_write: 0.625

  openai:
    gpt-5-mini:
      input: 0.25
      output: 2.00
      cache_read: 0.025
      batch_multiplier: 0.5
    gpt-5-nano:
      input: 0.05
      output: 0.40
      cache_read: 0.005
      batch_multiplier: 0.5
    gpt-5:
      input: 1.25
      output: 10.00
      cache_read: 0.125
      batch_multiplier: 0.5
    gpt-5.4-nano:
      input: 0.20
      output: 1.25
      cache_read: 0.02
      batch_multiplier: 0.5
    gpt-5.4-mini:
      input: 0.75
      output: 4.50
      cache_read: 0.075
      batch_multiplier: 0.5
    gpt-5.4-mini-2026-03-17:
      input: 0.75
      output: 4.50
      cache_read: 0.075
      batch_multiplier: 0.5
    gpt-5.4:
      input: 2.50
      output: 15.00
      cache_read: 0.25
      batch_multiplier: 0.5
    gpt-5.5:
      input: 5.00
      output: 30.00
      cache_read: 0.50
      batch_multiplier: 0.5
    # The GPT-5.6 line, 2026-09-12. Three models rather than a size ladder, and the prices are
    # what separate them: luna is the small one, terra the middle, sol the top. sol at 4.00/20.00
    # is the closest thing OpenAI sells to Claude Opus 5 at 5.00/25.00, and terra at 2.00/12.00
    # sits beside Claude Sonnet 5 at 2.00/10.00.
    gpt-5.6-luna:
      input: 0.20
      output: 1.20
      cache_read: 0.02
      cache_write: 0.25
      batch_multiplier: 0.5
    gpt-5.6-terra:
      input: 2.00
      output: 12.00
      cache_read: 0.20
      cache_write: 2.50
      batch_multiplier: 0.5
    gpt-5.6-sol:
      input: 4.00
      output: 20.00
      cache_read: 0.40
      cache_write: 5.00
      batch_multiplier: 0.5
    gpt-4o-mini:
      input: 0.15
      output: 0.60
      cache_read: 0.075
      batch_multiplier: 0.5

  google:
    gemini-2.5-flash:
      input: 0.30
      output: 2.50
      cache_read: 0.03
      batch_multiplier: 0.5
    gemini-2.5-flash-lite:
      input: 0.10
      output: 0.40
      cache_read: 0.01
      batch_multiplier: 0.5
    gemini-3.5-flash:
      input: 1.50
      output: 9.00
      cache_read: 0.15
      batch_multiplier: 0.5
    gemini-3.5-flash-lite:
      input: 0.30
      output: 2.50
      cache_read: 0.03
      batch_multiplier: 0.5
    gemini-3.6-flash:
      input: 0.75
      output: 3.75
      cache_read: 0.075
      batch_multiplier: 0.5
    gemini-3.7-flash:
      input: 0.75
      output: 3.75
      cache_read: 0.075
      batch_multiplier: 0.5
    gemini-3.8-flash:
      input: 0.75
      output: 3.75
      cache_read: 0.075
      batch_multiplier: 0.5

  openweights:
    # `cache_read` added 2026-09-12 after the first live call, and it is the reason
    # together-open-b wrote three uncosted rows. Together serves prompt caching and reports
    # `cached_tokens` in its usage: gpt-oss-120b returned 66 to 68 of them per call. The
    # gateway refuses to price a call that used a feature it has no rate for, which is the
    # right refusal and is how this was found at all rather than at the invoice.
    #
    # Read from https://www.together.ai/pricing on 2026-09-12: neither of these two models
    # shows a discounted cached rate, where others in the catalogue do, so cache reads are
    # charged as ordinary input. Checked rather than assumed, because a wrong rate here is a
    # wrong number in a cost table that this project publishes.
    #
    # Batch rates added 2026-09-14, from https://docs.together.ai/docs/batch-inference read
    # the same day. Together's batch discount is PER MODEL and not across the board, which is
    # the opposite of every other vendor here: only meta-llama/Llama-3.3-70B-Instruct-Turbo
    # and openai/whisper-large-v3 run at half price on the 24-hour window, and every other
    # serverless model runs at the standard rate. So gpt-oss-120b carries 1.0 rather than 0.5.
    # Writing 0.5 there would have understated its invoice by half on every batched call,
    # which is exactly the kind of plausible wrong number this project exists not to publish.
    # (Together also offers a 4-hour window at 25 percent off. Not used: nothing here needs an
    # answer sooner than 24 hours, so the adapter asks for the cheapest window only.)
    meta-llama/Llama-3.3-70B-Instruct-Turbo:
      input: 1.04
      output: 1.04
      cache_read: 1.04
      batch_multiplier: 0.5
    openai/gpt-oss-120b:
      input: 0.15
      output: 0.60
      cache_read: 0.15
      batch_multiplier: 1.0

  # Claude on Microsoft Foundry, added 2026-09-14. Keys are DEPLOYMENT names, not model ids:
  # a Foundry deployment may be called anything and the deployment name is what goes in the
  # request and lands in the ledger. These are the default deployment names, which match the
  # model ids. A deployment named something else needs its own entry here or its calls are
  # uncosted.
  #
  # Rates are the standard per-model USD rates, because that is what Foundry meters before
  # converting to CCUs. They are therefore identical to the `anthropic` block above, and that
  # duplication is deliberate: the two are separate entries so that a future divergence is one
  # file edit rather than a silent mispricing, and so the ledger can tell the platforms apart.
  #
  # NO batch_multiplier: the Message Batches API is not available on Foundry, so there is no
  # batch rate to apply. An absent multiplier means a batched call would be uncosted, which is
  # the correct answer for a feature the platform does not offer.
  #
  # NOT HERE: the US Data Zone Standard deployment type, which keeps inference inside the
  # United States and carries a 1.1x multiplier on every rate. It is a separate deployment with
  # its own name, so it gets its own entry with its own numbers when one is created.
  foundry:
    claude-opus-5:
      input: 5.00
      output: 25.00
      cache_read: 0.50
      cache_write: 6.25
    claude-opus-4-8:
      input: 5.00
      output: 25.00
      cache_read: 0.50
      cache_write: 6.25
    claude-sonnet-5:
      input: 2.00
      output: 10.00
      cache_read: 0.20
      cache_write: 2.50
    claude-sonnet-4-6:
      input: 3.00
      output: 15.00
      cache_read: 0.30
      cache_write: 3.75
    claude-haiku-4-5:
      input: 1.00
      output: 5.00
      cache_read: 0.10
      cache_write: 1.25

  # The Canadian Foundry resource's GPT deployment (config/boundary.yaml `foundry-canada`),
  # added 2026-10-02 from September's Azure invoice; see the note at the top of this file.
  # "Std Gl" is the Global Standard deployment type, which is the `residency: global` the
  # route declares: sent to Canada, processed wherever Azure chooses.
  foundry-canada:
    gpt-5.6-luna:
      input: 0.20
      output: 1.20

  # Claude on Amazon Bedrock from ca-central-1, added 2026-10-02 from AWS's Price List API;
  # see the note at the top of this file. September's bill shows the Marketplace line at
  # USD 0.00, which is what one Haiku call of 117 tokens in and 69 out rounds to.
  bedrock:
    us.anthropic.claude-haiku-4-5-20251001-v1:0:
      input: 1.10
      output: 5.50
      cache_read: 0.11
      cache_write: 1.375
      batch_multiplier: 0.5
    global.anthropic.claude-haiku-4-5-20251001-v1:0:
      input: 1.00
      output: 5.00
      cache_read: 0.10
      cache_write: 1.25
      batch_multiplier: 0.5

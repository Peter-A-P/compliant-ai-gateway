# Price list, USD per million tokens, copied from each vendor's price page on 2026-09-09.
# Repricing is a new dated file, never an edit to this one.
#
# Rules: a model missing here is written to the ledger as uncosted; a call that used a cache
# or batch feature with no rate here is uncosted. The library never fills a rate in.
#
# Model keys are the identifiers the vendor RETURNS in the response, which is what the ledger
# prices by. Where a vendor's page shows a marketing name rather than an API identifier, the
# identifier used here is the one the smoke call on Sep 12 is expected to return; if the
# vendor returns a different identifier the call is uncosted and the next price file adds it.
#
# Sources:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing (cache read 0.1x input,
#              5-minute cache write 1.25x input, batch 50%).
#   OpenAI:    https://developers.openai.com/api/docs/pricing (cached input shown per model,
#              batch 50%). openai.com/api/pricing returned 403 to a plain fetch.
#   Google:    https://ai.google.dev/gemini-api/docs/pricing (paid tier; context-cache read shown
#              per model; cache storage is billed per hour, not per token, so no cache_write rate;
#              batch 50%). September runs are on the free tier, which bills nothing, but the
#              ledger prices every call at list so cost figures are comparable across providers.
#   Together:  https://www.together.ai/pricing (serverless; one price for input and output on
#              Llama 3.3 70B).

version: 1
date: 2026-09-09
currency: USD
source: "Vendor price pages fetched 2026-09-09; see comments for URLs and rules"

per_million_tokens:
  anthropic:
    claude-haiku-4-5-20251001:
      input: 1.00
      output: 5.00
      cache_read: 0.10
      cache_write: 1.25
      batch_multiplier: 0.5

# Spend caps enforced by the library before a call is made. Second line of defence: the
# first line is the hard cap in each vendor's console (plan repository action 3).
#
# Amounts are USD because vendors bill in USD. Raise a cap here, deliberately, in a
# commit; never bypass it in code. Amounts set by Peter on 2026-09-08 (double the plan's first
# draft, to leave room for the two dry runs plus the official run); revisited at each budget review.

version: 1
portfolio_monthly_usd: 200

projects:
  # 03 drift runs: about US$9 per full run; two dry runs plus the Sep 27 official run.
  ai-release-gate:
    monthly_usd: 60
    per_run_usd: 30
  # 04 itself: smoke calls, one short request per provider per adapter change.
  compliant-ai-gateway:
    monthly_usd: 10
    per_run_usd: 2
  # 02 own-run panel. Its plan puts the full suite at about US$25 with the Anthropic share
  # batched, and the whole project's API line at about US$60. A month holds one full suite
  # plus a rerun; a run holds one full suite with room for the frontier subset beside it.
  # Confirmed by Peter 2026-09-11. Raise them here, deliberately, in a commit if they bind;
  # never bypass a cap in code.
  model-selection-tenth-cost:
    monthly_usd: 40
    per_run_usd: 30

default:
  monthly_usd: 10
  per_run_usd: 4

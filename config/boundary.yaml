# boundary configuration: providers, routes and defaults.
#
# Paths are relative to this file. Keys come from environment variables named in
# api_key_env and never from this file. Changing a route below moves every call that uses
# that alias; callers that pass provider/model-id explicitly are never moved.

version: 1

providers:
  anthropic:
    kind: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    api_version: "2023-06-01"
  openai:
    kind: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_tokens_field: max_completion_tokens
    # This host has /v1/files and /v1/batches. `openai_compat` does not imply that, because
    # most compatible hosts serve chat completions and nothing else, so each one says.
    batches: true
  google:
    kind: google
    base_url: https://generativelanguage.googleapis.com
    api_key_env: GOOGLE_API_KEY
    api_version: v1beta
  # Open-weights host for the 03 control arm. Renaming this entry is a change to the data:
  # the ledger records the provider name, so a rename shows up in every row written after it.
  openweights:
    kind: openai_compat
    base_url: https://api.together.xyz/v1
    api_key_env: OPENWEIGHTS_API_KEY
    # Together's batch endpoint is OpenAI-shaped. Note that its discount is per model rather
    # than across the board: only Llama-3.3-70B-Instruct-Turbo runs at half price, and
    # gpt-oss-120b runs at the standard rate, which is what the price file says.
    batches: true
  # Local server for 02 at price zero. No key.
  local:
    kind: openai_compat
    base_url: http://127.0.0.1:11434/v1
    price_zero: true

  # -- hyperscaler platforms (v0.2; Foundry and Vertex 2026-09-14, Bedrock 2026-09-15) -----
  #
  # All three entries are inert until their credentials exist: nothing routes to them, and
  # the key is only read when a call actually uses the provider. None has a price entry, so
  # a call through any of them writes an UNCOSTED row today. Bedrock has been exercised
  # live from ca-central-1 (2026-09-15); Foundry and Vertex have not. That is the designed behaviour, not an oversight: a price is
  # copied from the vendor's page on the day the account exists and is dated then, because
  # a rate written weeks early carries a date that lies about when it was checked.
  #
  # Claude on Microsoft Foundry. base_url is the resource's Target URI from the Foundry
  # portal, ending in /anthropic. The deployment name goes in the model identifier and may
  # differ from the model id, so the price file is keyed by deployment name.
  # Billing: Azure Marketplace, in Claude Consumption Units at US$0.01 per CCU, rated at the
  # standard per-model USD rates. So the ledger costs in USD and the Azure line item is in
  # CCUs: 100 CCU is US$1.00, and the invoice check divides before it compares.
  # A US Data Zone deployment carries a 1.1x multiplier and is a separate price entry.
  foundry:
    kind: azure_foundry
    base_url: https://REPLACE-ME.services.ai.azure.com/anthropic
    api_key_env: AZURE_FOUNDRY_API_KEY
    api_version: "2023-06-01"

  # Claude on Google Vertex AI via rawPredict. `project` is the Google Cloud project id,
  # which Vertex carries in the URL. `region` is a residency decision and the host must
  # agree with it: the adapter refuses a base_url whose region differs from the route's,
  # rather than quietly sending data to the other geography.
  # northamerica-northeast1 is Montreal, which is the Canadian worked example Part B's
  # residency policy builds on. Regional and multi-region endpoints carry a 10 percent
  # premium over global, so the region is part of the price key and not only of the route.
  # Claude on Amazon Bedrock, through the Anthropic Messages route. No SigV4 and no
  # botocore: the Bedrock API key goes in `x-api-key`, the same header the direct vendor
  # uses, so this is the Anthropic adapter with a different path.
  #
  # `residency` and the model identifier both have to be right, and they check each other.
  # On Bedrock the processing geography is encoded in the model id's prefix and nowhere
  # else: `us.` and `eu.` are geographies that may span countries, `global.` is anywhere,
  # and a bare id is single-region but only the bedrock-mantle host accepts it. So a
  # one-word edit to a route's model moves the data, and `residency` is the only thing in
  # the system that would disagree with it. The adapter refuses a mismatch.
  #
  # ca-central-1 is the best Canadian posture available: Geo and Global are supported here,
  # In-Region is not, and bedrock-mantle (the only guaranteed single-region route) does not
  # exist in Canada at all. Note that AWS's "US" geography INCLUDES Canada: us. from
  # ca-central-1 routes to ca-central-1, us-east-1, us-east-2 or us-west-2, and the response
  # does not say which. That is "Canada or the United States, unspecified", not residency.
  # See docs/hyperscaler-setup.md.
  bedrock:
    kind: aws_bedrock
    base_url: https://bedrock-runtime.ca-central-1.amazonaws.com
    region: ca-central-1
    residency: geo
    api_key_env: AWS_BEARER_TOKEN_BEDROCK
    api_version: "2023-06-01"

  vertex:
    kind: gcp_vertex
    base_url: https://northamerica-northeast1-aiplatform.googleapis.com
    region: northamerica-northeast1
    project: REPLACE-ME
    api_key_env: GOOGLE_VERTEX_ACCESS_TOKEN

# Aliases. Standard mode only; pass-through refuses them.
routes:
  fast:
    provider: anthropic
    model: claude-haiku-4-5-20251001
  balanced:
    provider: anthropic
    model: claude-sonnet-5
  judge:
    provider: anthropic
    model: claude-sonnet-5
  frontier:
    provider: anthropic
    model: claude-opus-5

# The price files live in the package, at boundary/prices/, and ship with it. `builtin`
# means those, and every project that installs boundary reads the same ones at whatever
# version it pinned. Point this at a directory instead only to try a rate before it is
# released, and never to keep a second copy.
prices: builtin
caps: caps.yaml

defaults:
  max_tokens: 1024
  timeouts:
    connect_s: 10
    read_s: 120

retry:
  max_attempts: 4
  base_delay_s: 0.5
  max_delay_s: 30

ledger:
  path: ../boundary.sqlite
  # Written into every row, so a ledger merged from several machines still says where each
  # call was made. BOUNDARY_ENV overrides it, which is how a runner labels itself
  # (BOUNDARY_ENV=actions) without editing this file.
  env: local

telemetry:
  exporter: none

cache:
  enabled: false
  path: ../.cache/boundary
